name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Refocus.app
        run: ./build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/Refocus.app build/Refocus.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Refocus-${{ github.sha }}
          path: build/Refocus.zip
          if-no-files-found: error
